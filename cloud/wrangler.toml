# MythScribe Cloud API (F-15.2, F-15.4): the Worker the app talks to. Today it serves the
# account routes (email magic link, sessions); F-15.4 adds the AI proxy that validates the
# session, checks credits, streams from the provider, meters tokens, and stores no manuscript
# content. See README.md for the routes, the migrations, and the secrets.
name = "mythscribe-api"
main = "src/index.ts"
account_id = "dcc26cac35ac537e749bfab8672bd8d3"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [{ pattern = "api.mythscribe.app", custom_domain = true }]

# The one D1 database (F-15.2 auth tables, F-15.3 credits; usage rows join it in F-15.5).
[[d1_databases]]
binding = "DB"
database_name = "mythscribe"
database_id = "47d97a47-28be-4557-9247-6ca9fb8e2bcd"
migrations_dir = "migrations"

# AI-BILLING-SPEC L5: every 5 minutes, release the holds of requests that never settled (and drop
# old rate-limit windows and access tokens). See `runScheduledSweep` in src/index.ts.
[triggers]
crons = ["*/5 * * * *"]

[vars]
# `resend` sends the sign-in email over HTTPS; `log` (via .dev.vars) prints the link instead and
# returns it as `devLink` from /auth/start so local runs can be driven end to end.
EMAIL_TRANSPORT = "resend"

# The balance packs on sale (F-15.3; $10 / $25 / $50 since 2026-10-07 — a pack below `min_pack_usd`
# in the billing_config table is not sold), as a JSON array of { variantId, url, priceCents }. Unset
# until the Lemon Squeezy products exist: the Account tab then says no packs are on sale.
# `priceCents` is the truth for the amount credited, so currency and tax never reach the balance.
LEMONSQUEEZY_PACKS = '[{"variantId":"2219616","url":"https://mythscribe.lemonsqueezy.com/checkout/buy/58399871-cdd7-4aa3-941c-6c745af2119f","priceCents":1000},{"variantId":"2219619","url":"https://mythscribe.lemonsqueezy.com/checkout/buy/669b12ab-6b9b-4b5c-a5cc-03524b8e2012","priceCents":2500},{"variantId":"2219620","url":"https://mythscribe.lemonsqueezy.com/checkout/buy/6b4967ac-4183-4db4-bbcb-e2506b35ce51","priceCents":5000}]'

# The one-time Supporter license (F-15.9), the same shape as one pack. Unset until the Lemon
# Squeezy product exists: `GET /license` then offers nothing and the Account tab says so. Buying it
# grants a license row, never credit.
# LEMONSQUEEZY_SUPPORTER = '{"variantId":"123457","url":"https://mythscribe.lemonsqueezy.com/buy/00000000-0000-0000-0000-000000000000","priceCents":3900}'

# The $30 one-time app license (M1, 2026-10-07), the same shape. It grants the same license row and
# token as the Supporter product, which it supersedes; `GET /license` offers it once set.
LEMONSQUEEZY_APP_LICENSE = '{"variantId":"2219611","url":"https://mythscribe.lemonsqueezy.com/checkout/buy/f74c3cc6-9fc7-42c6-a9cd-23ba102c1e1b","priceCents":3000}'

# The $5 starter pack (2026-10-08), the same shape: one per account ever (even after a refund),
# exempt from `min_pack_usd`, verified email only, no app license needed. Unset until the Lemon
# Squeezy product exists: the Account tab then offers no starter. `npm run cloud:products` writes it.
# LEMONSQUEEZY_STARTER = '{"variantId":"123459","url":"https://mythscribe.lemonsqueezy.com/checkout/buy/00000000-0000-0000-0000-000000000000","priceCents":500}'

# Prices, the markup, the trial grant, the limits, and the routing table are not here: they are
# rows of the `billing_config` D1 table (migration 0005), changed without a deploy. See README.md.

# Secrets (never in this file, never in the repo):
#   RESEND_API_KEY                the Resend key for sign-in@mythscribe.app  -> `npx wrangler secret put RESEND_API_KEY`
#   OPENROUTER_API_KEY            the operator's OpenRouter key (A9, preferred) -> `npx wrangler secret put OPENROUTER_API_KEY`
#   OPENAI_API_KEY                the operator's OpenAI key (F-15.4; used only without OPENROUTER_API_KEY)
#   LEMONSQUEEZY_WEBHOOK_SECRET   signs the billing webhook (F-15.3)         -> `npx wrangler secret put LEMONSQUEEZY_WEBHOOK_SECRET`
#   LICENSE_SIGNING_KEY           signs Supporter tokens (F-15.9)            -> `npm run cloud:license-keygen`, then `npx wrangler secret put LICENSE_SIGNING_KEY`
#   LEMONSQUEEZY_API_KEY          the store's API key, for refunds (2026-10-08) -> `npx wrangler secret put LEMONSQUEEZY_API_KEY`
# Without RESEND_API_KEY the Worker answers 503 NOT_CONFIGURED to /auth/start, and without
# LEMONSQUEEZY_WEBHOOK_SECRET the same to /billing/lemonsqueezy; without LEMONSQUEEZY_API_KEY
# `POST /billing/refund` answers 503 NOT_CONFIGURED ("Refunds are not configured on the server yet.").
# Local runs read them from ./.dev.vars (git-ignored); copy .dev.vars.example to start.
