# MythScribe Cloud API (F-15.2, F-15.4): the Worker the app talks to. Today it serves the
# account routes (email magic link, sessions); F-15.4 adds the AI proxy that validates the
# session, checks credits, streams from the provider, meters tokens, and stores no manuscript
# content. See README.md for the routes, the migrations, and the secrets.
name = "mythscribe-api"
main = "src/index.ts"
account_id = "dcc26cac35ac537e749bfab8672bd8d3"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [{ pattern = "api.mythscribe.app", custom_domain = true }]

# The one D1 database (F-15.2 auth tables, F-15.3 credits; usage rows join it in F-15.5).
[[d1_databases]]
binding = "DB"
database_name = "mythscribe"
database_id = "47d97a47-28be-4557-9247-6ca9fb8e2bcd"
migrations_dir = "migrations"

[vars]
# `resend` sends the sign-in email over HTTPS; `log` (via .dev.vars) prints the link instead and
# returns it as `devLink` from /auth/start so local runs can be driven end to end.
EMAIL_TRANSPORT = "resend"

# The credit packs on sale (F-15.3), as a JSON array of { variantId, url, priceCents }. Unset
# until the Lemon Squeezy products exist: the Account tab then says no packs are on sale.
# `priceCents` is the truth for the amount credited, so currency and tax never reach the balance.
# LEMONSQUEEZY_PACKS = '[{"variantId":"123456","url":"https://mythscribe.lemonsqueezy.com/buy/00000000-0000-0000-0000-000000000000","priceCents":500}]'

# The one-time Supporter license (F-15.9), the same shape as one pack. Unset until the Lemon
# Squeezy product exists: `GET /license` then offers nothing and the Account tab says so. Buying it
# grants a license row, never credit.
# LEMONSQUEEZY_SUPPORTER = '{"variantId":"123457","url":"https://mythscribe.lemonsqueezy.com/buy/00000000-0000-0000-0000-000000000000","priceCents":3900}'

# Secrets (never in this file, never in the repo):
#   RESEND_API_KEY                the Resend key for sign-in@mythscribe.app  -> `npx wrangler secret put RESEND_API_KEY`
#   OPENAI_API_KEY                the operator's OpenAI key (F-15.4)         -> `npx wrangler secret put OPENAI_API_KEY`
#   LEMONSQUEEZY_WEBHOOK_SECRET   signs the billing webhook (F-15.3)         -> `npx wrangler secret put LEMONSQUEEZY_WEBHOOK_SECRET`
#   LICENSE_SIGNING_KEY           signs Supporter tokens (F-15.9)            -> `npm run cloud:license-keygen`, then `npx wrangler secret put LICENSE_SIGNING_KEY`
# Without RESEND_API_KEY the Worker answers 503 NOT_CONFIGURED to /auth/start, and without
# LEMONSQUEEZY_WEBHOOK_SECRET the same to /billing/lemonsqueezy.
# Local runs read them from ./.dev.vars (git-ignored); copy .dev.vars.example to start.
