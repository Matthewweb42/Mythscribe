appId: com.mythscribe.app
productName: MythScribe
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
asarUnpack:
  - '**/*.node'
win:
  target: nsis
  executableName: MythScribe
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: dmg
  category: public.app-category.productivity
linux:
  target: AppImage
  category: Office
npmRebuild: true
